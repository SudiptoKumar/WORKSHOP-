<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><style>html,body{margin:0!important;padding:0!important;width:100%!important}body{background:#f5f5f7;color:#1d1d1f;-webkit-text-size-adjust:100%}table,td{border-collapse:collapse!important}a{text-decoration:none}@media screen and (max-width:600px){.shell{width:100%!important}.px{padding-left:20px!important;padding-right:20px!important}.h1{font-size:32px!important;line-height:37px!important}.btn a{display:block!important;width:100%!important;box-sizing:border-box!important}}</style></head><body style="margin:0;padding:0;background:#f5f5f7;"><div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f7;"><tr><td align="center" class="px" style="padding:16px 0;"><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="shell" style="width:600px;max-width:600px;background:#fff;margin:0 auto;"><tr><td align="center" style="padding:28px 24px 10px;"><img src="{{logo_url}}" width="58" height="58" alt="" style="display:block;width:58px;height:58px;object-fit:contain;margin:0 auto;"><div style="margin-top:9px;font:600 18px/23px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#1d1d1f;">{{organization_name}}</div><div style="margin-top:1px;font:500 11px/16px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:2px;color:#86868b;">PSTU</div></td></tr><tr><td align="center" class="px" style="padding:28px 32px 30px;"><div style="font:600 11px/17px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:.45px;color:#0066cc;">{{message_type}}</div><h1 class="h1" style="margin:8px 0 0;font:700 35px/40px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:-1.2px;color:#1d1d1f;">{{heading}}</h1><p style="margin:13px auto 0;max-width:480px;font:15px/23px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#6e6e73;">Hello, <strong style="color:#1d1d1f;">{{participant_name}}</strong>.</p></td></tr><tr><td class="px" style="padding:0 32px 24px;"><table role="presentation" width="100%" style="background:#f5f5f7;border-radius:16px;"><tr><td style="padding:22px 23px;"><div style="font:600 10px/15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:.8px;color:#86868b;text-transform:uppercase;">{{workshop_name}}</div><div style="margin-top:11px;font:15px/24px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#424245;">{{message_html}}</div></td></tr></table></td></tr>{{cta_block}}<tr><td class="px" style="padding:0 32px;"><div style="height:1px;background:#e5e5e7;"></div></td></tr><tr><td align="center" class="px" style="padding:20px 32px 26px;"><div style="font:600 14px/20px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#1d1d1f;">{{organization_name}}</div><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:10px auto 0;">
<tr>
    <td style="padding:0 4px;"><a href="{{facebook_url}}" aria-label="Facebook" title="Facebook"><span style="display:block;width:34px;height:34px;border-radius:17px;background:#ffffff;border:1px solid #d2d2d7;text-align:center;"><img src="https://cdn.simpleicons.org/facebook/000000" width="16" height="16" alt="" style="display:block;width:16px;height:16px;margin:9px auto;"></span></a></td>
    <td style="padding:0 4px;"><a href="{{linkedin_url}}" aria-label="LinkedIn" title="LinkedIn"><span style="display:block;width:34px;height:34px;border-radius:17px;background:#ffffff;border:1px solid #d2d2d7;text-align:center;"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384014.png" width="16" height="16" alt="" style="display:block;width:16px;height:16px;margin:9px auto;"></span></a></td>
    <td style="padding:0 4px;"><a href="{{instagram_url}}" aria-label="Instagram" title="Instagram"><span style="display:block;width:34px;height:34px;border-radius:17px;background:#ffffff;border:1px solid #d2d2d7;text-align:center;"><img src="https://cdn.simpleicons.org/instagram/000000" width="16" height="16" alt="" style="display:block;width:16px;height:16px;margin:9px auto;"></span></a></td>
    <td style="padding:0 4px;"><a href="{{website_url}}" aria-label="Website" title="Website"><span style="display:block;width:34px;height:34px;border-radius:17px;background:#ffffff;border:1px solid #d2d2d7;text-align:center;"><img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" width="16" height="16" alt="" style="display:block;width:16px;height:16px;margin:9px auto;"></span></a></td>
    <td style="padding:0 4px;"><a href="{{x_url}}" aria-label="X" title="X"><span style="display:block;width:34px;height:34px;border-radius:17px;background:#ffffff;border:1px solid #d2d2d7;text-align:center;"><img src="https://cdn.simpleicons.org/x/000000" width="16" height="16" alt="" style="display:block;width:16px;height:16px;margin:9px auto;"></span></a></td>
</tr></table><div style="margin-top:8px;font:9px/15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#aeaeb2;">© {{current_year}} {{organization_name}}. All rights reserved.</div></td></tr></table></td></tr></table></body></html>
